<svg xmlns="http://www.w3.org/2000/svg" width="308" height="197" viewBox="0 0 308 197" role="img"><title>The orchestrator has no shell and never edits code. It writes four briefs, each with a scope and a check, and orders them: the schema lands first, the other three build on it.</title><style>@font-face{font-family:'nr400';src:url(data:font/woff2;base64,) format('woff2')}text{white-space:pre}</style><text x="0.0" y="34.0" font-size="18" text-anchor="start"><tspan font-family="'nr400'" fill="#ececea">The orchestrator has no shell and never</tspan></text><text x="0.0" y="61.0" font-size="18" text-anchor="start"><tspan font-family="'nr400'" fill="#ececea">edits code.</tspan></text><text x="0.0" y="92.0" font-size="18" text-anchor="start"><tspan font-family="'nr400'" fill="#b5b5b2">It writes four briefs, each with a scope</tspan></text><text x="0.0" y="119.0" font-size="18" text-anchor="start"><tspan font-family="'nr400'" fill="#b5b5b2">and a check, and orders them: the</tspan></text><text x="0.0" y="146.0" font-size="18" text-anchor="start"><tspan font-family="'nr400'" fill="#b5b5b2">schema lands first, the other three build</tspan></text><text x="0.0" y="173.0" font-size="18" text-anchor="start"><tspan font-family="'nr400'" fill="#b5b5b2">on it.</tspan></text></svg>