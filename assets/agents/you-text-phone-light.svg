<svg xmlns="http://www.w3.org/2000/svg" width="308" height="170" viewBox="0 0 308 170" role="img"><title>I type one line: &quot;add passkey login, keep passwords as fallback&quot;. It touches the database, the server, the login screen and the browser test, so it becomes a task with a check for done.</title><style>@font-face{font-family:'nr400';src:url(data:font/woff2;base64,) format('woff2')}text{white-space:pre}</style><text x="0.0" y="34.0" font-size="18" text-anchor="start"><tspan font-family="'nr400'" fill="#141414">I type one line: &quot;add passkey login, keep</tspan></text><text x="0.0" y="61.0" font-size="18" text-anchor="start"><tspan font-family="'nr400'" fill="#141414">passwords as fallback&quot;.</tspan></text><text x="0.0" y="92.0" font-size="18" text-anchor="start"><tspan font-family="'nr400'" fill="#474747">It touches the database, the server, the</tspan></text><text x="0.0" y="119.0" font-size="18" text-anchor="start"><tspan font-family="'nr400'" fill="#474747">login screen and the browser test, so it</tspan></text><text x="0.0" y="146.0" font-size="18" text-anchor="start"><tspan font-family="'nr400'" fill="#474747">becomes a task with a check for done.</tspan></text></svg>