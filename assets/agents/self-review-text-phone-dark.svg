<svg xmlns="http://www.w3.org/2000/svg" width="308" height="143" viewBox="0 0 308 143" role="img"><title>Each worker reviews its own diff before anyone else sees it. It reads every changed line against its brief and fixes what it finds.</title><style>@font-face{font-family:'nr400';src:url(data:font/woff2;base64,) format('woff2')}text{white-space:pre}</style><text x="0.0" y="34.0" font-size="18" text-anchor="start"><tspan font-family="'nr400'" fill="#ececea">Each worker reviews its own diff before</tspan></text><text x="0.0" y="61.0" font-size="18" text-anchor="start"><tspan font-family="'nr400'" fill="#ececea">anyone else sees it.</tspan></text><text x="0.0" y="92.0" font-size="18" text-anchor="start"><tspan font-family="'nr400'" fill="#b5b5b2">It reads every changed line against its</tspan></text><text x="0.0" y="119.0" font-size="18" text-anchor="start"><tspan font-family="'nr400'" fill="#b5b5b2">brief and fixes what it finds.</tspan></text></svg>