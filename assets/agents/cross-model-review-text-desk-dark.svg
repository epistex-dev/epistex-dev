<svg xmlns="http://www.w3.org/2000/svg" width="846" height="126" viewBox="0 0 846 126" role="img"><title>A model from another family reviews once and finds what all four self-reviews missed: a used challenge is never deleted, so a replayed sign-in works. It blocks because it has a reachable trigger, and it is fixed with a test.</title><style>@font-face{font-family:'nr400';src:url(data:font/woff2;base64,) format('woff2')}text{white-space:pre}</style><text x="0.0" y="34.0" font-size="21" text-anchor="start"><tspan font-family="'nr400'" fill="#ececea">A model from another family reviews once and finds what all four self-reviews missed:</tspan></text><text x="0.0" y="66.0" font-size="21" text-anchor="start"><tspan font-family="'nr400'" fill="#ececea">a used challenge is never deleted, so a replayed sign-in works.</tspan></text><text x="0.0" y="102.0" font-size="21" text-anchor="start"><tspan font-family="'nr400'" fill="#b5b5b2">It blocks because it has a reachable trigger, and it is fixed with a test.</tspan></text></svg>