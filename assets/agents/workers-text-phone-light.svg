<svg xmlns="http://www.w3.org/2000/svg" width="308" height="143" viewBox="0 0 308 143" role="img"><title>Four workers, one brief each: schema first, then three in parallel. Each writes a failing test first, sees it fail for its own reason, then makes it pass.</title><style>@font-face{font-family:'nr400';src:url(data:font/woff2;base64,) format('woff2')}text{white-space:pre}</style><text x="0.0" y="34.0" font-size="18" text-anchor="start"><tspan font-family="'nr400'" fill="#141414">Four workers, one brief each: schema</tspan></text><text x="0.0" y="61.0" font-size="18" text-anchor="start"><tspan font-family="'nr400'" fill="#141414">first, then three in parallel.</tspan></text><text x="0.0" y="92.0" font-size="18" text-anchor="start"><tspan font-family="'nr400'" fill="#474747">Each writes a failing test first, sees it fail</tspan></text><text x="0.0" y="119.0" font-size="18" text-anchor="start"><tspan font-family="'nr400'" fill="#474747">for its own reason, then makes it pass.</tspan></text></svg>